<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パチンカス人生ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // Disable createImageBitmap BEFORE GLTFLoader.js loads, since it feature-detects
  // this at parse time. Some environments fail to decode images via this path.
  window.createImageBitmap = undefined;
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{
    --bg-deep:#101425;
    --panel-dark:rgba(10,12,28,0.8);
    --cyan:#4CE0FF;
    --magenta:#FF5FC4;
    --yellow:#FFD23F;
    --green:#39FF6A;
    --red:#FF4757;
    --orange:#FF9F45;
    --slate:#6C7BAE;
    --plus:#4CE07A;
    --minus:#FF6E95;
    --accent:#2ecc71;
    --line:#3a2f6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-deep);color:#fff;overflow-x:hidden;
    font-family:"Noto Sans JP",sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 8px 40px;position:relative;}

  h1.logo{
    font-size:clamp(18px,4vw,30px);color:var(--yellow);text-shadow:2px 2px 0 rgba(0,0,0,.35);
    font-weight:900;letter-spacing:1px;margin:10px 0 4px;text-align:center;
  }
  .subtitle-text{font-size:12px;color:#cbd5ff;letter-spacing:.5px;font-weight:700;}

  #title{
    background:var(--panel-dark);border:2px solid rgba(255,255,255,.15);border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    padding:28px 22px;max-width:440px;width:100%;text-align:center;
  }
  #title p{font-size:12px;color:var(--yellow);letter-spacing:1px;}
  .count-row{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
  .pbtn{
    width:48px;height:48px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:var(--bg-deep);
    color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:"Noto Sans JP",sans-serif;
  }
  .pbtn.selected{background:var(--accent);border-color:var(--accent);color:#062b16;}
  .name-inputs{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
  .name-row{display:flex;align-items:center;gap:8px;}
  .avatar-sq{width:22px;height:22px;border:2px solid #000;border-radius:5px;flex-shrink:0;}
  .name-inputs input{
    flex:1;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:#221c46;
    color:#fff;font-size:13px;outline:none;font-family:"Noto Sans JP",sans-serif;
  }
  .name-inputs input:focus{border-color:var(--cyan);}
  .start-btn{
    margin-top:10px;background:var(--green);color:#06210f;border:none;
    padding:14px 28px;border-radius:10px;font-size:13px;cursor:pointer;letter-spacing:1px;
    font-family:"Noto Sans JP",sans-serif;box-shadow:0 4px 0 #0d5c2c;
  }
  .start-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d5c2c;}

  #game{display:none;width:100%;max-width:1040px;flex-direction:column;align-items:center;gap:14px;}

  .map-outer{
    width:100%;border-radius:16px;overflow:hidden;
    position:relative;height:460px;box-shadow:0 10px 30px rgba(0,0,0,.5);border:2px solid #000;
  }
  #gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* --- floating UI over the board --- */
  .top-panel{
    position:absolute;top:10px;left:10px;z-index:15;background:var(--panel-dark);
    border-radius:14px;padding:10px 14px;min-width:170px;box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  .tp-row{display:flex;align-items:center;gap:10px;}
  .tp-avatar{width:28px;height:28px;overflow:hidden;position:relative;flex-shrink:0;margin-top:-4px;margin-left:-4px;}
  .tp-name{font-size:12px;font-weight:900;}
  .tp-job{font-size:9px;color:var(--cyan);}
  .tp-money{margin-top:6px;font-size:20px;font-weight:900;color:var(--yellow);font-family:"Noto Sans JP",sans-serif;}
  .tp-money.neg{color:var(--red);}
  .tp-others{display:flex;gap:4px;margin-top:6px;}
  .tp-mini{width:12px;height:12px;border-radius:3px;border:1px solid #000;}

  .side-menu{position:absolute;top:138px;left:10px;z-index:15;display:flex;flex-direction:column;gap:6px;}
  .side-menu button{
    background:var(--panel-dark);color:#fff;border:none;border-radius:20px;
    padding:9px 16px;font-size:11px;font-weight:700;text-align:left;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .side-menu button.active{background:var(--accent);color:#062b16;}

  .side-panel{
    display:none;position:absolute;top:138px;left:150px;right:14px;z-index:16;
    background:var(--panel-dark);border-radius:14px;padding:14px 16px;box-shadow:0 8px 20px rgba(0,0,0,.5);
    max-width:420px;
  }
  .panel-title{font-family:"Noto Sans JP",sans-serif;font-size:11px;color:var(--yellow);margin-bottom:10px;}
  .status-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);}
  .status-row.cur{color:var(--yellow);font-weight:700;}
  .status-row .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .status-row .nm{flex:1;}
  .status-row .jb{font-size:9px;color:var(--cyan);}
  .mm-bar{position:relative;height:30px;background:#20204a;border-radius:8px;margin:8px 0;}
  .mm-mark{position:absolute;top:-16px;transform:translateX(-50%);font-size:12px;}
  .mm-dot{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;border:2px solid #000;transform:translateX(-50%);}
  .mm-note{font-size:9px;color:#a89fdc;}
  .side-action{
    display:block;width:100%;background:#2a2456;color:#fff;border:none;border-radius:8px;
    padding:10px 12px;margin-top:8px;font-size:12px;cursor:pointer;text-align:left;
  }
  .side-action:hover{background:#3a3070;}

  .mute-corner{
    position:absolute;top:10px;right:10px;z-index:15;background:var(--panel-dark);border:none;
    border-radius:20px;padding:6px 10px;cursor:pointer;color:#fff;font-size:14px;
  }

  .node{
    position:absolute;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:15px;border:2px solid rgba(0,0,0,.45);z-index:2;
    box-shadow:0 5px 0 rgba(0,0,0,.3), 0 8px 12px rgba(0,0,0,.25), inset 0 3px 5px rgba(255,255,255,.4);
  }
  .node::before{
    content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
    width:30px;height:9px;background:rgba(0,0,0,.35);border-radius:50%;filter:blur(2px);z-index:-1;
  }
  .node .nlabel{position:absolute;top:44px;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap;text-align:center;
    font-family:"Noto Sans JP",sans-serif;}

  /* ---------- Smartphone-friendly adjustments ---------- */
  @media (max-width: 640px){
    body{padding:10px 6px 24px;}
    h1.logo{font-size:20px;}
    .subtitle-text{font-size:10px;}
    #title{padding:20px 16px;}
    .top-panel{min-width:132px;padding:8px 10px;top:8px;left:8px;}
    .tp-name{font-size:11px;}
    .tp-money{font-size:16px;}
    .side-menu{top:104px;left:8px;gap:5px;}
    .side-menu button{padding:8px 12px;font-size:10px;border-radius:16px;}
    .mute-corner{top:8px;right:8px;padding:5px 8px;font-size:12px;}
    .side-panel{
      position:fixed;left:5%;right:5%;top:18%;bottom:18%;max-width:none;
      overflow-y:auto;z-index:40;
    }
    .arcade{padding:8px 12px;gap:6px;bottom:8px;}
    .reel-window{width:52px;height:52px;}
    .reel-num{height:52px;font-size:22px;}
    .spin-btn{padding:9px 18px;font-size:10px;}
    .node{width:34px;height:34px;font-size:12px;}
    .node .nlabel{top:36px;font-size:6px;}
    #dialogueBox{padding:14px 14px 18px;}
    #dlgText{font-size:13px;}
  }
  .node.type-start{background:radial-gradient(circle at 35% 30%, #eafff0, var(--green) 65%);}
  .node.type-goal{background:radial-gradient(circle at 35% 30%, #ffe9ec, var(--red) 65%);}
  .node.type-plus{background:radial-gradient(circle at 35% 30%, #eafff2, var(--plus) 65%);}
  .node.type-minus{background:radial-gradient(circle at 35% 30%, #fff0f4, var(--minus) 65%);}
  .node.type-event{background:radial-gradient(circle at 35% 30%, #ffeafa, var(--magenta) 65%);}
  .node.type-branch{background:radial-gradient(circle at 35% 30%, #fff3e8, var(--orange) 65%);animation:pulseStop 1s infinite alternate;}
  .node.type-route{background:radial-gradient(circle at 35% 30%, #eef0fb, var(--slate) 65%);}
  .node.type-payday{background:radial-gradient(circle at 35% 30%, #fffbe6, var(--yellow) 65%);color:#3a2f00;animation:pulseStop 1s infinite alternate;}
  .node.type-shopfork{background:radial-gradient(circle at 35% 30%, #fff6e0, #FFB13C 65%);animation:pulseStop 1s infinite alternate;}
  @keyframes pulseStop{from{box-shadow:0 5px 0 rgba(0,0,0,.3), 0 8px 12px rgba(0,0,0,.25);}to{box-shadow:0 5px 0 rgba(0,0,0,.3), 0 8px 12px rgba(0,0,0,.25), 0 0 16px currentColor;}}

  .sprite{
    position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);
    transition:left .28s linear, top .28s linear;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));
    animation:bob .5s infinite alternate;z-index:5;
  }
  .sprite-shadow{
    position:absolute;width:26px;height:9px;background:rgba(0,0,0,.4);border-radius:50%;
    filter:blur(1.5px);transform:translate(-50%,0);z-index:4;transition:left .28s linear, top .28s linear;
  }
  @keyframes bob{from{transform:translate(-50%,-50%) translateY(0);}to{transform:translate(-50%,-50%) translateY(-4px);}}

  .arcade{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:15;
    background:var(--panel-dark);border:2px solid rgba(255,255,255,.15);border-radius:16px;
    padding:12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  .machine-name{font-family:"Noto Sans JP",sans-serif;font-size:8px;color:var(--yellow);letter-spacing:1px;}
  .reel-window{width:64px;height:64px;overflow:hidden;background:#050414;border:3px solid var(--cyan);border-radius:10px;position:relative;}
  .reel-col{position:absolute;top:0;left:0;width:100%;}
  .reel-num{height:64px;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:28px;color:#FF3838;text-shadow:0 0 10px #FF3838;}
  .spin-btn{
    background:var(--red);color:#fff;border:none;border-radius:20px;padding:10px 24px;
    font-family:"Noto Sans JP",sans-serif;font-size:11px;cursor:pointer;box-shadow:0 4px 0 #8a1420;
  }
  .spin-btn:disabled{opacity:.4;cursor:not-allowed;}
  .spin-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1420;}

  .money-fx{position:fixed;inset:0;z-index:65;pointer-events:none;}
  .money-fx span{position:absolute;font-size:26px;}
  @keyframes moneyUp{from{opacity:1;transform:translateY(0) rotate(0deg);}to{opacity:0;transform:translateY(-240px) rotate(25deg);}}
  @keyframes moneyDown{from{opacity:1;transform:translateY(0) rotate(0deg);}to{opacity:0;transform:translateY(240px) rotate(-25deg);}}

  #dialogueOverlay{
    display:none;position:fixed;inset:0;background:rgba(5,4,18,.55);z-index:60;
    align-items:flex-end;justify-content:center;padding:0 0 46px;
  }
  #dialogueBox{
    width:100%;max-width:640px;background:#181433;border:2px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:18px 20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .dlg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .dlg-icon{font-size:22px;}
  .dlg-title{font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--yellow);}
  #dlgText{font-size:14px;min-height:44px;line-height:1.6;color:#eae6ff;}
  .dlg-delta{font-family:"Noto Sans JP",sans-serif;font-size:16px;margin-top:8px;}
  .dlg-delta.plus{color:var(--green);}
  .dlg-delta.minus{color:var(--red);}
  .dlg-next{margin-top:12px;text-align:right;font-size:12px;color:var(--cyan);cursor:pointer;}
  .job-menu{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .job-card{
    border:2px solid var(--line);background:#221c46;border-radius:10px;padding:10px 12px;cursor:pointer;
    text-align:left;
  }
  .job-card:hover{border-color:var(--yellow);background:#2c2458;}
  .job-card b{display:block;font-family:"Noto Sans JP",sans-serif;font-size:11px;color:var(--cyan);margin-bottom:4px;}
  .job-card span{font-size:12px;color:#cfc9ee;}
  .mini-reel{
    width:56px;height:56px;background:#050414;border:2px solid var(--cyan);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .bar-symbol{
    display:inline-block;background:#0a0a0a;color:#FFD23F;font-size:11px;font-weight:900;
    padding:3px 5px;border-radius:3px;border:1.5px solid #FFD23F;letter-spacing:0.5px;
  }
  .stop-btn{
    background:var(--cyan);color:#06232b;border:none;border-radius:8px;padding:7px 14px;
    font-size:11px;font-weight:700;cursor:pointer;
  }
  .stop-btn:disabled{opacity:.4;cursor:not-allowed;}
  .odds-table{
    display:flex;flex-direction:column;gap:4px;margin:10px 0;
    background:#20204a;border-radius:8px;padding:10px 12px;
  }
  .odds-head{display:grid;grid-template-columns:1.3fr 0.8fr 0.7fr;font-size:9px;color:#a89fdc;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center;}
  .odds-head span:first-child{text-align:left;}
  .odds-row{display:grid;grid-template-columns:1.3fr 0.8fr 0.7fr;align-items:center;font-size:12px;text-align:center;}
  .odds-row span:first-child{text-align:left;}
  .odds-row b{color:var(--yellow);font-size:13px;}
  .odds-mult{color:var(--cyan);font-weight:700;font-size:12px;}

  #result{display:none;max-width:460px;width:100%;background:#181433;border:2px solid rgba(255,255,255,.15);
    border-radius:16px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  #result h2{font-family:"Noto Sans JP",sans-serif;font-size:20px;font-weight:900;color:var(--yellow);text-shadow:2px 2px 0 rgba(0,0,0,.3);}
  .score-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;
    margin:6px 0;font-family:"Noto Sans JP",sans-serif;font-size:10px;background:#221c46;text-align:left;gap:8px;
  }
  .score-row.first{background:linear-gradient(90deg,#4a3a00,#6b5400);border:2px solid var(--yellow);}
  .restart-btn{
    margin-top:16px;background:var(--cyan);color:#06232b;border:none;padding:12px 24px;border-radius:10px;
    font-family:"Noto Sans JP",sans-serif;font-size:11px;cursor:pointer;box-shadow:0 4px 0 #0a5866;
  }
</style>
</head>
<body>
<h1 class="logo">🎰 パチンカス人生</h1>
<p class="subtitle-text">～負けるが人生・出玉が全て～</p>

<div id="title">
  <p class="subtitle-text">何人で沼に沈む？</p>
  <div class="count-row" id="countRow"></div>
  <div class="name-inputs" id="nameInputs"></div>
  <button class="start-btn" id="startBtn">実戦スタート</button>
</div>

<div id="game">
  <div class="map-outer" id="mapOuter">
    <canvas id="gameCanvas"></canvas>

    <div class="top-panel" id="topPanel"></div>
    <div class="side-menu" id="sideMenu">
      <button data-tab="roulette" class="active" onclick="setTab('roulette')">🎯 ルーレット</button>
      <button data-tab="status" onclick="setTab('status')">📋 ステータス</button>
      <button data-tab="map" onclick="setTab('map')">🗺️ マップ</button>
      <button data-tab="other" onclick="setTab('other')">⚙️ その他</button>
    </div>
    <div class="side-panel" id="sidePanel"></div>
    <button class="mute-corner" id="muteBtn">🔊</button>

    <div class="arcade" id="arcadePanel">
      <div class="machine-name">CR パチンカス人生 スペシャル</div>
      <div class="reel-window"><div class="reel-col" id="reelCol"></div></div>
      <button class="spin-btn" id="spinBtn">レバーを叩く!</button>
    </div>
  </div>
</div>

<div id="result">
  <h2>実戦終了!</h2>
  <div id="rankList"></div>
  <button class="restart-btn" id="restartBtn">もう一回打つ？</button>
</div>

<div id="dialogueOverlay">
  <div id="dialogueBox"></div>
</div>

<script>
/* ================= SOUND ================= */
let audioCtx = null;
let soundOn = true;
function ensureCtx(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }
function tone(freq, dur, type='square', vol=0.12, delay=0){
  if(!soundOn) return;
  ensureCtx();
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function sndStep(){ tone(220,0.06,'square',0.08); }
function sndClick(){ tone(880,0.04,'square',0.06); }
function sndCoin(){ tone(988,0.08,'square',0.12); tone(1318,0.12,'square',0.12,0.08); }
function sndBuzz(){ tone(120,0.25,'sawtooth',0.15); tone(90,0.25,'sawtooth',0.12,0.05); }
function sndFanfare(){ [523,659,784,1046].forEach((f,i)=> tone(f,0.16,'square',0.14,i*0.13)); }

window.toggleSound = function(){
  soundOn = !soundOn;
  document.getElementById('muteBtn').textContent = soundOn ? '🔊' : '🔇';
  const sb = document.getElementById('sideMuteBtn');
  if(sb) sb.textContent = soundOn ? '🔊 音: ON' : '🔇 音: OFF';
};
document.getElementById('muteBtn').onclick = toggleSound;

/* ================= MONEY FX ================= */
function moneyEffect(delta){
  if(!delta) return;
  const container = document.createElement('div');
  container.className='money-fx';
  document.body.appendChild(container);
  const count = Math.min(14, 3 + Math.round(Math.abs(delta)/1.5));
  for(let i=0;i<count;i++){
    const span = document.createElement('span');
    span.textContent = delta>=0 ? '💴' : '💸';
    span.style.left = (40+Math.random()*20)+'%';
    span.style.top = delta>=0 ? '80%' : '8%';
    span.style.fontSize = (18+Math.random()*16)+'px';
    span.style.animation = `${delta>=0?'moneyUp':'moneyDown'} ${0.9+Math.random()*0.5}s ease-in forwards`;
    span.style.animationDelay = (Math.random()*0.35)+'s';
    container.appendChild(span);
  }
  setTimeout(()=>container.remove(), 1900);
}

/* ================= GAME DATA ================= */
const COLORS = ['#FF3EC8','#4CE0FF','#FFD23F','#39FF6A','#FF7A3D','#B388FF'];
const TOTAL = 78;

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const CARD_PLUS_LOW = [
  {text:"宝くじのスクラッチで少し当たった。", delta:1.0},
  {text:"フリマで着なくなった服を売った。", delta:1.5},
  {text:"残業代が入った。", delta:1.8},
  {text:"友人に貸していたお金が返ってきた。", delta:2.0},
  {text:"自炊を頑張って節約できた。", delta:0.6},
  {text:"ポイ活サイトで地味に得した。", delta:0.5},
  {text:"スーパーの半額シールに助けられた。", delta:0.4},
  {text:"駅前でもらった引換券でちょっと得した。", delta:0.2},
  {text:"台の常連に「兄弟の匂いがする」と言われ意気投合、缶コーヒーをおごってもらった。", delta:0.8},
  {text:"神社のおみくじが大吉だったので勢いで換金所に直行、なぜか得した。", delta:1.3},
  {text:"隣のおばあちゃんが「これあげる」と謎の飴を大量にくれた(換金は出来ない)。", delta:0.3},
  {text:"宝くじ売り場のおじさんと仲良くなり、次回の当たり番号を教えてもらった気がする(たぶん嘘)。", delta:0.6},
];

function zoneOf(idx){ return idx < 26 ? 'low' : (idx < 52 ? 'mid' : 'high'); }
function isPlusIndex(idx){ return idx % 2 === 0; }
function poolFor(idx){
  const plus = isPlusIndex(idx);
  const zone = zoneOf(idx);
  const table = {
    low:  { plus: CARD_PLUS_LOW,  minus: CARD_MINUS_LOW  },
    mid:  { plus: CARD_PLUS_MID,  minus: CARD_MINUS_MID  },
    high: { plus: CARD_PLUS_HIGH, minus: CARD_MINUS_HIGH },
  };
  return { plus, pool: table[zone][plus ? 'plus' : 'minus'] };
}

/* ---- Shop fork: every 7 squares, a single forced-stop "visit the shop?" choice ---- */
function eligibleForShop(idx){
  if(idx<=0 || idx>=TOTAL-1) return false;
  if(BRANCHES.some(b=>b.entry===idx)) return false;
  if(BRANCHES.some(b=> idx>b.entry && idx<b.merge)) return false;
  if(FIXED_EVENTS[idx]) return false;
  if(PAYDAYS.includes(idx)) return false;
  return true;
}
function buildShopForks(){
  const forks = {};
  let occurrence = 0;
  for(let idx=7; idx<TOTAL-1; idx+=7){
    if(eligibleForShop(idx)){
      occurrence++;
      forks[idx] = { bet: Math.pow(2, occurrence-1), occurrence };
    }
  }
  return forks;
}
const SHOP_FORKS = buildShopForks();
function getBranchByEntry(idx){ return BRANCHES.find(b=>b.entry===idx); }
function branchAt(idx){ return BRANCHES.find(b=> idx>b.entry && idx<b.merge); }
const FORCED = new Set([...PAYDAYS, ...BRANCHES.map(b=>b.entry)]);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function drawCategory(setting){
  const t = SETTEI_TABLE[setting-1];
  const r = Math.random()*100;
  let acc = 0;
  for(const [name,pct] of [['hazure',t.hazure],['bell',t.bell],['replay',t.replay],['bar',t.bar],['seven',t.seven]]){
    acc += pct;
    if(r < acc) return name;
  }
  return 'hazure';
}

function getStaticVisual(idx){
  if(idx===0) return {type:'start', icon:'🎰', label:'スタート'};
  if(idx===TOTAL-1) return {type:'goal', icon:'🏆', label:'ゴール'};
  if(PAYDAYS.includes(idx)) return {type:'payday', icon:'💰', label:'給料日'};
  if(getBranchByEntry(idx)) return {type:'branch', icon:'🔀', label:'分岐点'};
  if(SHOP_FORKS[idx]) return {type:'shopfork', icon:'🏪', label:'寄り道?'};
  if(FIXED_EVENTS[idx]) return {type:'event', icon:FIXED_EVENTS[idx].icon, label:FIXED_EVENTS[idx].label};
  const {plus} = poolFor(idx);
  return plus ? {type:'plus', icon:'🍀', label:'＋イベント'} : {type:'minus', icon:'💦', label:'－イベント'};
}
function getSquare(p, idx){
  if(idx===0) return {type:'start'};
  if(idx===TOTAL-1) return {type:'goal'};
  if(PAYDAYS.includes(idx)) return {type:'payday'};
  const entryBranch = getBranchByEntry(idx);
  if(entryBranch) return {type:'branch', branch:entryBranch};
  const br = branchAt(idx);
  if(br){
    const routeIdx = p.branchChoices[br.entry] ?? 0;
    const route = br.routes[routeIdx];
    return {type:'route', route, branch:br};
  }
  if(SHOP_FORKS[idx]) return {type:'shopfork', fork:SHOP_FORKS[idx]};
  if(FIXED_EVENTS[idx]) return {type:'event', ...FIXED_EVENTS[idx]};
  const {plus, pool} = poolFor(idx);
  return {type: plus ? 'plus' : 'minus', pool};
}

const SPRITE_PATTERN = [
  "..XX....",".XXXX...",".XXXX...","..XX....",".XXXX...","XXXXXX..","XX..XX..","XX..XX..",

function spriteShadow(color, unit){
  const parts = [];
  SPRITE_PATTERN.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      if(row[x]==='X') parts.push(`${x*unit}px ${y*unit}px 0 0 ${color}`);
    }
  });
  return parts.join(',');
}
function makeSpriteEl(color, size){
  const unit = size/8;
  const el = document.createElement('div');
  el.style.position='relative';
  el.style.width=unit+'px';
  el.style.height=unit+'px';
  el.style.boxShadow = spriteShadow(color, unit);
  return el;
}

const SPACING = 2.3;   // world units per board index
const AMP = 1.6;       // sideways wiggle amplitude of the trunk path
const LANE_GAP = 1.7;  // sideways offset between branch lanes

function nodePos(i){
  return { x: i*SPACING, z: Math.sin(i*0.8)*AMP };
}
function branchLanePos(i, br, laneIdx, laneCount){
  const L = br.merge - br.entry - 1;
  const k = i - br.entry - 1;
  const t = (k+1)/(L+1);
  const zStart = nodePos(br.entry).z;
  const zEnd = nodePos(br.merge).z;
  const centerZ = zStart + (zEnd-zStart)*t;
  const offset = (laneIdx - (laneCount-1)/2) * LANE_GAP;
  const z = centerZ + offset*Math.sin(t*Math.PI);
  const x = i*SPACING;
  return {x, z};
}
function shopLoopPos(entryIdx, stage){
  const p0 = nodePos(entryIdx);
  const p1 = nodePos(entryIdx+1);
  const dx = p1.x - p0.x;
  const x = stage===1 ? p0.x + dx*0.35 : p0.x + dx*0.7;
  const z = Math.max(p0.z, p1.z) + LANE_GAP*0.9;
  return {x, z};
}
function getPlayerVisualPos(p){
  if(p.shopVisual) return shopLoopPos(p.shopVisual.entry, p.shopVisual.stage);
  const br = branchAt(p.pos);
  if(br){
    const laneIdx = p.branchChoices[br.entry] ?? 0;
    return branchLanePos(p.pos, br, laneIdx, br.routes.length);
  }
  return nodePos(p.pos);
}

/* ---------- Three.js scene setup ---------- */
const TYPE_COLORS = {
  start:0x39FF6A, goal:0xFF4757, plus:0x4CE07A, minus:0xFF6E95,
  event:0xFF5FC4, branch:0xFF9F45, route:0x6C7BAE, payday:0xFFD23F,
  shopfork:0xFFB13C, card:0x8b7fd1,
};
const DAY_SKY   = new THREE.Color('#8FE3FF');
const DUSK_SKY  = new THREE.Color('#FF8F6B');
const NIGHT_SKY = new THREE.Color('#0b1030');

let scene, camera, renderer, canvasEl;
let pulseGroup = [];   // meshes that gently bob/pulse (branch/payday/shopfork markers)
let playerGroup;       // THREE.Group holding current player pieces
let boardBuilt = false;
let totalWidth3D = 0;
let cameraX = 0, cameraTargetX = 0;

function initThree(){
  canvasEl = document.getElementById('gameCanvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(DAY_SKY.getHex(), 20, 55);

  camera = new THREE.PerspectiveCamera(48, 1, 0.1, 300);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
  sunLight.position.set(8, 16, 8);
  scene.add(sunLight);

  // ground strip
  totalWidth3D = (TOTAL-1)*SPACING;
  const groundGeo = new THREE.PlaneGeometry(totalWidth3D+40, 40);
  const groundMat = new THREE.MeshStandardMaterial({ color:0x3f9e45, roughness:0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(totalWidth3D/2, -0.15, 0);
  scene.add(ground);

  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  buildDecorSync();
  loadBuildingModels(buildBuildingInstances);
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(animate);
}

function resizeCanvas(){
  const w = canvasEl.clientWidth || 300;
  const h = canvasEl.clientHeight || MAP_H;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

function animate(time){
  requestAnimationFrame(animate);

  // smooth camera dolly toward the active player
  cameraX += (cameraTargetX - cameraX) * 0.07;
  camera.position.set(cameraX - 3.2, 8.5, 11);
  camera.lookAt(cameraX + 3, 0, 0);

  // day -> dusk -> night sky based on progress along the board
  const frac = Math.min(1, Math.max(0, cameraX / Math.max(1,totalWidth3D)));
  let sky;
  if(frac < 0.7){
    sky = DAY_SKY.clone().lerp(DUSK_SKY, frac/0.7*0.3);
  } else {
    sky = DUSK_SKY.clone().lerp(NIGHT_SKY, (frac-0.7)/0.3);
  }
  scene.background = sky;
  scene.fog.color = sky;

  // gentle pulse for special squares
  const t = time*0.003;
  pulseGroup.forEach((m,i)=>{
    const s = 1 + Math.sin(t*2 + i)*0.12;
    m.scale.set(s,s,s);
  });

  // player bob
  playerGroup.children.forEach((g,i)=>{
    g.position.y = 0.55 + Math.sin(t*3 + i*1.7)*0.08;
  });

  renderer.render(scene, camera);
}

/* ---------- decorative low-poly scenery ---------- */
function addTree(x, z, scale, dark){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6),
    new THREE.MeshStandardMaterial({ color:0x5a3d24, roughness:0.9 })
  );
  trunk.position.y = 0.25;
  g.add(trunk);
  const foliage = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.3, 7),
    new THREE.MeshStandardMaterial({ color: dark?0x1f7a4d:0x2ec172, roughness:0.85 })
  );
  foliage.position.y = 1.05;
  g.add(foliage);
  g.position.set(x, 0, z);
  g.scale.setScalar(scale);
  scene.add(g);
}
function addMountain(x, z){
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(4.5, 5.5, 5),
    new THREE.MeshStandardMaterial({ color:0x8f7fd1, roughness:1, opacity:0.75, transparent:true })
  );
  m.position.set(x, 2.5, z);
  scene.add(m);
}
function addSunMoon(){
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 16, 16),
    new THREE.MeshStandardMaterial({ color:0xFFD23F, emissive:0xFFD23F, emissiveIntensity:0.9 })
  );
  sun.position.set(-4, 8, -6);
  scene.add(sun);
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 16, 16),
    new THREE.MeshStandardMaterial({ color:0xE8E8FF, emissive:0xCFC9FF, emissiveIntensity:0.7 })
  );
  moon.position.set(totalWidth3D+4, 8, -6);
  scene.add(moon);
}
function buildDecorSync(){
  addSunMoon();
  for(let mx=-5; mx<totalWidth3D+10; mx+=16){
    addMountain(mx, -14 - (mx%3));
    addMountain(mx+7, 15 + (mx%4));
  }
  for(let tx=-2; tx<totalWidth3D+4; tx+=2.4){
    const side = (Math.floor(tx)%2===0) ? 1 : -1;
    addTree(tx, side*(2.2+(tx%3)*0.4), 0.8+((tx*3)%10)/20, tx%7===0);
  }
}

const gltfLoaderInstance = new THREE.GLTFLoader();
function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
const BUILDING_SCALE = { filler:0.9, early:0.9, mid:0.85, late:0.6 };
let buildingTemplates = {};
let buildingBaseOffset = {};
function loadBuildingModels(onDone){
  const keys = Object.keys(BUILDING_MODELS_B64);
  let remaining = keys.length;
  if(remaining===0){ onDone(); return; }
  keys.forEach(key=>{
    try{
      const buf = base64ToArrayBuffer(BUILDING_MODELS_B64[key]);
      gltfLoaderInstance.parse(buf, '', (gltf)=>{
        buildingTemplates[key] = gltf.scene;
        const box = new THREE.Box3().setFromObject(gltf.scene);
        buildingBaseOffset[key] = -box.min.y;
        const size = new THREE.Vector3(); box.getSize(size);
        console.log('[building loaded]', key, 'size(x,y,z)=', size.x.toFixed(2), size.y.toFixed(2), size.z.toFixed(2),
          'min.y=', box.min.y.toFixed(2), 'max.y=', box.max.y.toFixed(2));
        if(--remaining===0) onDone();
      }, (err)=>{
        console.error('glTF load failed:', key, err);
        if(--remaining===0) onDone();
      });
    }catch(e){
      console.error('glTF parse error:', key, e);
      if(--remaining===0) onDone();
    }
  });
}
let placedBuildingCount = 0;
function placeBuildingModel(key, x, z){
  const template = buildingTemplates[key];
  if(!template){ console.warn('[building missing template]', key); return; }
  const inst = template.clone(true);
  const scaleMul = BUILDING_SCALE[key] || 1;
  inst.scale.setScalar(scaleMul);
  const baseOffset = (buildingBaseOffset[key] || 0) * scaleMul;
  inst.position.set(x, baseOffset, z);
  scene.add(inst);
  placedBuildingCount++;
  if(placedBuildingCount<=3){
    console.log('[building placed]', key, 'at x,z=', x.toFixed(2), z.toFixed(2), 'scale=', scaleMul);
  }
}
function buildBuildingInstances(){
  console.log('[buildBuildingInstances] templates available:', Object.keys(buildingTemplates));
  for(let bx=2; bx<totalWidth3D-2; bx+=5.2){
    const frac = bx/totalWidth3D;
    const key = frac<0.33 ? (Math.floor(bx)%2===0?'early':'filler')
              : frac<0.66 ? (Math.floor(bx)%2===0?'mid':'filler')
              : (Math.floor(bx)%2===0?'late':'filler');
    const side = (Math.floor(bx)%2===0) ? 1 : -1;
    placeBuildingModel(key, bx, side*(3.6+ (bx%2)));
  }
  console.log('[buildBuildingInstances] total placed:', placedBuildingCount, 'of totalWidth3D=', totalWidth3D.toFixed(2));
}

/* ---------- board squares ---------- */
function makeSquareMesh(type){
  const color = TYPE_COLORS[type] ?? 0x8b7fd1;
  const isSpecial = (type==='branch' || type==='payday' || type==='shopfork' || type==='start' || type==='goal');
  const radius = isSpecial ? 0.62 : 0.5;
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.26, 18),
    new THREE.MeshStandardMaterial({ color, roughness:0.45, metalness:0.08 })
  );
  mesh.position.y = 0.13;
  if(isSpecial){
    const marker = new THREE.Mesh(
      new THREE.ConeGeometry(0.22, 0.4, 6),
      new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.35 })
    );
    marker.position.y = 0.5;
    mesh.add(marker);
    pulseGroup.push(marker);
  }
  return mesh;
}
function placeSquare(pos, type){
  const mesh = makeSquareMesh(type);
  mesh.position.x = pos.x;
  mesh.position.z = pos.z;
  scene.add(mesh);
  return mesh;
}

function buildStaticBoard(){
  let i = 0;
  while(i < TOTAL){
    const br = getBranchByEntry(i);
    if(br){
      placeSquare(nodePos(i), 'branch');
      const L = br.merge - br.entry - 1;
      br.routes.forEach((route, laneIdx)=>{
        for(let k=0;k<L;k++){
          const idx = br.entry+1+k;
          placeSquare(branchLanePos(idx, br, laneIdx, br.routes.length), 'route');
        }
      });
      placeSquare(nodePos(br.merge), getStaticVisual(br.merge).type);
      i = br.merge + 1;
      continue;
    }
    placeSquare(nodePos(i), getStaticVisual(i).type);
    i++;
  }
  // decorative "visit the shop" loop under each shop fork
  Object.keys(SHOP_FORKS).map(Number).forEach(idx=>{
    if(idx+1 >= TOTAL) return;
    placeSquare(shopLoopPos(idx,1), 'route');
    placeSquare(shopLoopPos(idx,2), 'route');
  });
}

/* ---------- player pieces ---------- */
function makePlayerMesh(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.6, 8),
    new THREE.MeshStandardMaterial({ color, roughness:0.4 })
  );
  body.position.y = 0.3;
  g.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 10, 10),
    new THREE.MeshStandardMaterial({ color, roughness:0.4 })
  );
  head.position.y = 0.66;
  g.add(head);
  return g;
}
function renderSprites(){
  playerGroup.clear();
  const groups = {};
  players.forEach(p=>{
    const vp = getPlayerVisualPos(p);
    const key = Math.round(vp.x*10)+','+Math.round(vp.z*10);
    (groups[key] = groups[key] || {pos:vp, list:[]}).list.push(p);
  });
  Object.values(groups).forEach(g=>{
    g.list.forEach((p, gi)=>{
      const mesh = makePlayerMesh(p.color);
      const offset = (gi-(g.list.length-1)/2) * 0.4;
      mesh.position.set(g.pos.x, 0.55, g.pos.z + offset);
      playerGroup.add(mesh);
    });
  });
}

function renderMap(){
  if(!scene) initThree();
  if(!boardBuilt){ buildStaticBoard(); boardBuilt = true; }
  renderSprites();
}
function scrollToActive(){
  const p = players[currentIdx];
  if(!p) return;
  const pos = getPlayerVisualPos(p);
  cameraTargetX = pos.x;
}

window.setTab = function(tab){
  activeTab = tab;
  document.querySelectorAll('.side-menu button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const panel = document.getElementById('sidePanel');
  const arcade = document.getElementById('arcadePanel');
  if(tab==='roulette'){
    panel.style.display='none';
    arcade.style.display='flex';
    return;
  }
  arcade.style.display='none';
  panel.style.display='block';
  if(tab==='status') panel.innerHTML = buildStatusHtml();
  if(tab==='map') panel.innerHTML = buildMiniMapHtml();
  if(tab==='other') panel.innerHTML = buildOtherHtml();
};
function refreshSidePanel(){
  if(activeTab==='roulette') return;
  setTab(activeTab);
}
function buildStatusHtml(){
  return `<div class="panel-title">📋 ステータス</div>` + players.map(p=>`
    <div class="status-row ${p===players[currentIdx]?'cur':''}">
      <span class="dot" style="background:${p.color}"></span>
      <span class="nm">${p.name}</span>
      <span class="jb">${p.job}</span>
      <span style="${p.money<0?'color:#FF4757':''}">¥${p.money.toFixed(1)}万</span>
    </div>`).join('');
}
function buildMiniMapHtml(){
  const marks = [];
  PAYDAYS.forEach(i=> marks.push({pct:i/(TOTAL-1)*100, label:'💰'}));
  BRANCHES.forEach(b=> marks.push({pct:b.entry/(TOTAL-1)*100, label:'🔀'}));
  marks.push({pct:0, label:'🎰'});
  marks.push({pct:100, label:'🏆'});
  const dots = players.map(p=>`<div class="mm-dot" style="left:${(p.pos/(TOTAL-1)*100)}%;background:${p.color}"></div>`).join('');
  const markHtml = marks.map(m=>`<div class="mm-mark" style="left:${m.pct}%">${m.label}</div>`).join('');
  return `<div class="panel-title">🗺️ マップ全体</div>
    <div class="mm-bar">${markHtml}${dots}</div>
    <div class="mm-note">現在の位置を％で表示しています</div>`;
}
function buildOtherHtml(){
  return `<div class="panel-title">⚙️ その他</div>
    <button class="side-action" id="sideMuteBtn" onclick="toggleSound()">${soundOn?'🔊 音: ON':'🔇 音: OFF'}</button>
    <button class="side-action" onclick="backToTitle()">🏠 タイトルに戻る</button>`;
}

  document.getElementById('game').style.display='none';
  document.getElementById('title').style.display='block';
};

const REEL_SEQ = [1,2,3,4,5,6,1,2,3,4,5,6,1,2,3,4,5,6,1,2,3,4,5,6];
function buildReel(){
  reelCol.innerHTML='';
  REEL_SEQ.forEach(n=>{
    const d=document.createElement('div');
    d.className='reel-num'; d.textContent=n;
    reelCol.appendChild(d);
  });
  reelCol.style.transition='none';
  reelCol.style.transform='translateY(0px)';
}
buildReel();

function spinReel(onDone){
  spinning = true; spinBtn.disabled = true;
  ensureCtx();
  reelCol.style.transition='none';
  reelCol.style.transform='translateY(0px)';
  const num = 1 + Math.floor(Math.random()*6);

  const fastOffset = -(12*64);
  const tick1 = setInterval(sndClick, 60);
  requestAnimationFrame(()=>{
    reelCol.style.transition='transform 0.45s linear';
    reelCol.style.transform=`translateY(${fastOffset}px)`;
  });

  setTimeout(()=>{
    clearInterval(tick1);
    const targetIndex = 18 + (num-1);
    const finalOffset = -(targetIndex*64);
    const tick2 = setInterval(sndClick, 120);
    reelCol.style.transition='transform 1.3s cubic-bezier(.15,.85,.25,1)';
    reelCol.style.transform=`translateY(${finalOffset}px)`;

    setTimeout(()=>{
      clearInterval(tick2);
      spinning = false; spinBtn.disabled = false;
      onDone(num);
    }, 1300);
  }, 460);
}

spinBtn.onclick = ()=>{
  if(spinning) return;
  const cur = players[currentIdx];
  if(cur && cur.shopAwaitingRound2){
    sndClick();
    cur.shopAwaitingRound2 = false;
    startShopRound(cur, cur.shopVisual.entry, cur.shopVisual.bet, cur.shopVisual.occurrence, true);
    return;
  }
  spinReel((num)=>{ sndClick(); movePlayer(num); });
};

function movePlayer(steps){
  const p = players[currentIdx];
  let left = steps;
  const iv = setInterval(()=>{
    if(left<=0 || p.pos>=TOTAL-1){
      clearInterval(iv);
      onLanded();
      return;
    }
    p.pos++;
    sndStep();
    renderSprites();
    scrollToActive();
    refreshSidePanel();

    if(SHOP_FORKS[p.pos]){
      clearInterval(iv);
      openShopForkDialog(p, p.pos, left);
      return;
    }

    left--;
    if(FORCED.has(p.pos) || p.pos>=TOTAL-1){
      clearInterval(iv);
      onLanded();
    }
  }, 260);
}

/* ================= DIALOGUE ================= */
const overlay = document.getElementById('dialogueOverlay');
const box = document.getElementById('dialogueBox');
function typewrite(el, text, speed=22){
  el.textContent='';
  let i=0;
  const iv = setInterval(()=>{
    el.textContent += text[i]; i++;
    if(i>=text.length) clearInterval(iv);
  }, speed);
}
function showDialogue(html, onShown){
  box.innerHTML = html;
  overlay.style.display='flex';
  if(onShown) onShown();
}
function closeDialogue(){
  overlay.style.display='none';
  finishTurn();
}
window.closeDialogue = closeDialogue;

function applyDelta(p, delta){ p.money = Math.round((p.money + delta)*10)/10; }

function dialogueDeltaHtml(icon,title,text,delta){
  const cls = delta>=0?'plus':'minus';
  const sign = delta>=0?'+':'';
  return `
    <div class="dlg-head"><span class="dlg-icon">${icon}</span><span class="dlg-title">${title}</span></div>
    <div id="dlgText"></div>
    <div class="dlg-delta ${cls}">${sign}${delta.toFixed(1)}万円</div>
    <div class="dlg-next" onclick="closeDialogue()">つづける ▶</div>
  `;
}

function onLanded(){
  const p = players[currentIdx];
  const data = getSquare(p, p.pos);
  renderTopPanel();

  if(data.type==='goal'){
    p.finished = true;
    sndFanfare();
    showDialogue(`
      <div class="dlg-head"><span class="dlg-icon">🏆</span><span class="dlg-title">GOAL!</span></div>
      <div id="dlgText"></div>
      <div class="dlg-next" onclick="closeDialogue()">つづける ▶</div>
    `, ()=> typewrite(document.getElementById('dlgText'), `${p.name} はゴールに到着した！お疲れさまでした。`));
    return;
  }

  if(data.type==='payday'){
    showDialogue(`
      <div class="dlg-head"><span class="dlg-icon">💰</span><span class="dlg-title">給料日！</span></div>
      <div id="dlgText"></div>
      <div class="dlg-next" onclick="paydaySpin()">レバーを叩く! ▶</div>
    `, ()=> typewrite(document.getElementById('dlgText'), "給料日だ！レバーを叩いて受け取り額を決めよう。"));
    return;
  }

  if(data.type==='branch'){
    const br = data.branch;
    const cards = br.routes.map((r,i)=>`
      <div class="job-card" onclick="chooseRoute(${br.entry},${i})">
        <b>${r.icon} ${r.name}</b><span>${r.desc}</span>
      </div>`).join('');
    showDialogue(`
      <div class="dlg-head"><span class="dlg-icon">🔀</span><span class="dlg-title">${br.title}</span></div>
      <div id="dlgText"></div>
      <div class="job-menu">${cards}</div>
    `, ()=> typewrite(document.getElementById('dlgText'), br.prompt));
    return;
  }

  if(data.type==='route'){
    const route = data.route;
    const ev = pickRandom(route.pool);
    applyDelta(p, ev.delta);
    moneyEffect(ev.delta);
    (ev.delta>=0? sndCoin: sndBuzz)();
    showDialogue(dialogueDeltaHtml(route.icon, route.name, ev.text, ev.delta),
      ()=> typewrite(document.getElementById('dlgText'), ev.text));
    return;
  }

  if(data.type==='event'){
    applyDelta(p, data.delta);
    moneyEffect(data.delta);
    (data.delta>=0? sndCoin: sndBuzz)();
    showDialogue(dialogueDeltaHtml(data.icon, data.label, data.msg, data.delta),
      ()=> typewrite(document.getElementById('dlgText'), data.msg));
    return;
  }

  if(data.type==='plus' || data.type==='minus'){
    const ev = pickRandom(data.pool);
    applyDelta(p, ev.delta);
    moneyEffect(ev.delta);
    (data.type==='plus'? sndCoin: sndBuzz)();
    const title = data.type==='plus' ? 'ラッキーイベント' : '注意イベント';
    const icon = data.type==='plus' ? '🍀' : '💦';
    showDialogue(dialogueDeltaHtml(icon, title, ev.text, ev.delta),
      ()=> typewrite(document.getElementById('dlgText'), ev.text));
    return;
  }
}

/* ================= SHOP FORK + SLOT SHOP MINI-GAME ================= */
let shopState = null;

function oddsText(pct){ return `1/${Math.floor(100/pct)}`; }
function oddsTableHtml(setting){
  const t = SETTEI_TABLE[setting-1];
  const rows = [
    ['🔁 リプレイ', oddsText(t.replay), '再抽選'],
    ['🔔 ベル',     oddsText(t.bell),   '×2'],
    ['<span class="bar-symbol">BAR</span>', oddsText(t.bar), '×5'],
    ['7️⃣ 777',     oddsText(t.seven),  '×10'],
  ];
  return `
    <div class="odds-table">
      <div class="odds-head"><span>絵柄</span><span>確率</span><span>倍率</span></div>
      ${rows.map(([label,odds,mult])=>`
        <div class="odds-row"><span>${label}</span><b>${odds}</b><span class="odds-mult">${mult}</span></div>
      `).join('')}
    </div>
  `;
}
function leverScreenHtml(setting){
  return `
    <div class="dlg-head"><span class="dlg-icon">🎰</span><span class="dlg-title">設定${setting} の台</span></div>
    <div id="dlgText"></div>
    ${oddsTableHtml(setting)}
    <div style="display:flex;gap:10px;justify-content:center;margin:14px 0;">
      <div class="mini-reel" id="mreel0">？</div>
      <div class="mini-reel" id="mreel1">？</div>
      <div class="mini-reel" id="mreel2">？</div>
    </div>
    <div id="stopBtnRow" style="display:flex;gap:8px;justify-content:center;"></div>
    <div id="leverRow" style="text-align:center;margin-top:10px;">
      <button class="spin-btn" onclick="pullShopLever()">レバーON</button>
    </div>
  `;
}

window.startShopRound = function(p, forkIdx, bet, occurrence, isSecond){
  shopState = { p, forkIdx, bet, occurrence, isSecond, perm: shuffle([1,2,3,4,5,6]) };
  const cards = shopState.perm.map((_,i)=>`
    <div class="job-card" onclick="selectShopMachine(${i})">
      <b>🎰 ${i+1}号機</b><span>設定は選ぶまでのお楽しみ</span>
    </div>`).join('');
  showDialogue(`
    <div class="dlg-head"><span class="dlg-icon">🏪</span><span class="dlg-title">スロット台を選ぼう</span></div>
    <div id="dlgText"></div>
    <div class="job-menu">${cards}</div>
  `, ()=> typewrite(document.getElementById('dlgText'), `掛け金は${bet}万円。6台の中から1台選んでください。`));
};

window.selectShopMachine = function(i){
  const setting = shopState.perm[i];
  shopState.setting = setting;
  sndClick();
  showDialogue(leverScreenHtml(setting),
    ()=> typewrite(document.getElementById('dlgText'), `この台は「設定${setting}」だ！掛け金${shopState.bet}万円でレバーを叩こう。`));
};

window.replayLever = function(){
  showDialogue(leverScreenHtml(shopState.setting),
    ()=> typewrite(document.getElementById('dlgText'), "もう一度レバーを叩こう！(掛け金は据え置き)"));
};

window.pullShopLever = function(){
  sndClick();
  const cat = drawCategory(shopState.setting);
  shopState.category = cat;
  shopState.symbols = symbolsForCategory(cat);
  shopState.stopped = [false,false,false];
  document.getElementById('leverRow').style.display = 'none';
  document.getElementById('stopBtnRow').innerHTML = [0,1,2].map(i=>
    `<button class="stop-btn" id="stopBtn${i}" onclick="stopShopReel(${i})">STOP${i+1}</button>`
  ).join('');
  shopState.intervals = [0,1,2].map(i=>{
    const el = document.getElementById('mreel'+i);
    return setInterval(()=>{ el.innerHTML = symbolIcon(pickRandom(SLOT_SYMBOLS)); }, 90);
  });
};

window.stopShopReel = function(i){
  sndClick();
  clearInterval(shopState.intervals[i]);
  document.getElementById('mreel'+i).innerHTML = symbolIcon(shopState.symbols[i]);
  document.getElementById('stopBtn'+i).disabled = true;
  shopState.stopped[i] = true;
  if(shopState.stopped.every(Boolean)){
    setTimeout(revealShopResult, 400);
  }
};

function shopResultHtml(icon, title, text, delta){
  const cls = delta>=0 ? 'plus' : 'minus';
  const sign = delta>=0 ? '+' : '';
  return `
    <div class="dlg-head"><span class="dlg-icon">${icon}</span><span class="dlg-title">${title}</span></div>
    <div id="dlgText"></div>
    <div class="dlg-delta ${cls}">${sign}${delta.toFixed(1)}万円</div>
    <div class="dlg-next" onclick="finishShopRound()">つづける ▶</div>
  `;
}

function revealShopResult(){
  const { p, bet, category } = shopState;
  if(category === 'replay'){
    showDialogue(`
      <div class="dlg-head"><span class="dlg-icon">🔁</span><span class="dlg-title">リプレイ!</span></div>
      <div id="dlgText"></div>
      <div style="text-align:center;margin-top:10px;"><button class="spin-btn" onclick="replayLever()">レバーをもう一度叩く</button></div>
    `, ()=> typewrite(document.getElementById('dlgText'), "リプレイ揃い！追加投資なしでもう一度レバーを叩けます。"));
    return;
  }
  let delta = 0, msg = '';
  if(category==='hazure'){ delta = -bet; msg = `ハズレ…掛け金${bet}万円を失った。`; }
  else if(category==='bell'){ delta = bet; msg = `ベル揃い！掛け金が2倍になって戻ってきた(+${bet}万円)。`; }
  else if(category==='bar'){ delta = bet*4; msg = `BAR揃い！掛け金が5倍になって戻ってきた(+${bet*4}万円)。`; }
  else if(category==='seven'){ delta = bet*9; msg = `777！！大当たり！掛け金が10倍になって戻ってきた(+${bet*9}万円)。`; }
  applyDelta(p, delta);
  moneyEffect(delta);
  (delta>=0 ? sndCoin : sndBuzz)();
  if(delta >= bet*3) sndFanfare();
  renderTopPanel();
  showDialogue(shopResultHtml('🎰','結果発表', msg, delta),
    ()=> typewrite(document.getElementById('dlgText'), msg));
}

window.finishShopRound = function(){
  const { p, forkIdx, bet, occurrence, isSecond } = shopState;
  overlay.style.display='none';
  if(!isSecond){
    p.shopVisual.stage = 2;
    p.shopAwaitingRound2 = true;
  } else {
    p.shopVisual = null;
    p.shopAwaitingRound2 = false;
    p.shopBranchesDone.add(forkIdx);
  }
  finishTurn();
};

window.paydaySpin = function(){
  if(spinning) return;
  overlay.style.display='none';
  spinReel((num)=>{
    const p = players[currentIdx];
    const delta = num*10;
    applyDelta(p, delta);
    moneyEffect(delta);
    sndCoin();
    renderTopPanel();
    const msg = `レバーを叩いて${num}が出た！給料${delta.toFixed(1)}万円が入った。`;
    showDialogue(dialogueDeltaHtml('💰','給料日！', msg, delta),
      ()=> typewrite(document.getElementById('dlgText'), msg));
  });
};

window.chooseRoute = function(entryIdx, routeIdx){
  const p = players[currentIdx];
  const br = getBranchByEntry(entryIdx);
  const route = br.routes[routeIdx];
  p.branchChoices[entryIdx] = routeIdx;
  if(route.jobTag) p.job = route.jobTag;
  sndClick();
  closeDialogue();
};

let forkContext = null;
window.openShopForkDialog = function(p, idx, remaining){
  forkContext = { p, idx, remaining };
  const fork = SHOP_FORKS[idx];
  showDialogue(`
    <div class="dlg-head"><span class="dlg-icon">🏪</span><span class="dlg-title">寄り道スポット</span></div>
    <div id="dlgText"></div>
    <div class="job-menu">
      <div class="job-card" onclick="shopForkChoice(true)">
        <b>🎰 寄ってみる</b><span>スロット台に挑戦(掛け金 ${fork.bet}万円)</span>
      </div>
      <div class="job-card" onclick="shopForkChoice(false)">
        <b>🚶 素通りする</b><span>そのまま先に進む</span>
      </div>
    </div>
  `, ()=> typewrite(document.getElementById('dlgText'), "商店街の前を通りかかった。ちょっと寄っていく？"));
};

window.shopForkChoice = function(visit){
  const { p, idx, remaining } = forkContext;
  const fork = SHOP_FORKS[idx];
  sndClick();
  overlay.style.display = 'none';
  if(!visit){
    if(remaining > 0) movePlayer(remaining);
    else finishTurn();
    return;
  }
  p.shopVisual = { entry: idx, stage: 1, bet: fork.bet, occurrence: fork.occurrence };
  startShopRound(p, idx, fork.bet, fork.occurrence, false);
};

function finishTurn(){
  renderTopPanel(); renderMap();
  spinBtn.disabled=false; spinning=false;

  if(players.every(pl=>pl.finished)){ showFinalResult(); return; }
  do{ currentIdx = (currentIdx+1)%players.length; } while(players[currentIdx].finished);
  renderTopPanel(); scrollToActive();
}

/* ================= RESULT ================= */
function resultComment(money){
  if(money >= 100) return '勝ち逃げ成功！伝説の軍団長';
  if(money >= 30)  return 'まずまずの人生';
  if(money >= 0)   return 'なんとか生き残った…';
  if(money >= -30) return 'そろそろヤメ時かも';
  return '完全に沼、質屋の常連';
}
function showFinalResult(){
  document.getElementById('game').style.display='none';
  const rd = document.getElementById('result');
  rd.style.display='block';
  const sorted = [...players].sort((a,b)=>b.money-a.money);
  document.getElementById('rankList').innerHTML = sorted.map((p,i)=>`
    <div class="score-row ${i===0?'first':''}">
      <span>${i+1}. ${p.name} (${p.job})<br><span style="font-size:8px;color:#a89fdc;">${resultComment(p.money)}</span></span>
      <span style="${p.money<0?'color:#FF4757;':''}">¥${p.money.toFixed(1)}万</span>
    </div>`).join('');
}
document.getElementById('restartBtn').onclick = ()=>{
  document.getElementById('result').style.display='none';
  document.getElementById('title').style.display='block';
};
</script>
